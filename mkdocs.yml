site_name: Bindle
site_description: >-
  A minimal, provider-neutral toolchain bridge — durable coordination state,
  evidence pointers, and connective tissue between tools that already own
  their own domains.

# docs_dir stays at MkDocs's default so one tree covers docs/site/*.md and the
# canonical docs/*.md (specs/006 research.md Decision 2/3).
#
# docs/index.md is the one exception to docs/site/ holding site-only pages:
# MkDocs builds only a page named docs/index.md to the root index.html.

nav:
  - Home: index.md
  - Getting Started: site/getting-started.md
  - Spec Kit & Symphony: site/spec-kit-and-symphony.md
  - How Bindle Works: site/how-bindle-works.md
  - Reference:
      - Philosophy: PHILOSOPHY.md
      - Scope: SCOPE.md
      - Data Ownership: DATA-OWNERSHIP.md
      - Symphony: SYMPHONY.md
      - Worktrees: WORKTREES.md
      - Privacy: PRIVACY.md
      - Toolchain: TOOLCHAIN.md
      - Decisions: DECISIONS.md

# Built-in theme, no third-party theme dependency; D047 supersedes the original
# "no custom CSS/JS" (specs/006 research.md Decision 1) but authorizes only
# theme config, one small stylesheet, and homepage assets, not a third-party
# theme, frontend framework, or branding system.
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

extra_css:
  - assets/extra.css

plugins:
  - search

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
