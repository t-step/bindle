[project]
name = "bindle"
dynamic = ["version"]
description = "Bindle CLI — a minimal, provider-neutral entrypoint for toolchain seam helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
bindle = "bindle.cli:main"

# MkDocs is repository documentation tooling (mkdocs.yml, docs/,
# `mkdocs build --strict` in scripts/check.sh) — not required to run the
# Bindle CLI at runtime. `dependency-groups` is PEP 735 / uv-native; the
# `dev` group is included by `uv run` automatically (no `--group` needed),
# so `uv run mkdocs build --strict` keeps working with no other change.
[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bindle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bindle"]
