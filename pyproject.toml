[project]
name = "bindle"
dynamic = ["version"]
description = "Bindle CLI — a minimal, provider-neutral entrypoint for toolchain seam helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
bindle = "bindle.cli:main"

# MkDocs is docs tooling (scripts/check.sh), not a CLI runtime dependency.
# PEP 735/uv-native `dev` group: `uv run` includes it by default, no --group.
[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bindle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bindle"]
