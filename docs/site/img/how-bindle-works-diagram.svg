<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" font-family="Helvetica, Arial, sans-serif">
  <title>How Bindle works: from Spec Kit task decomposition through Bindle's coordination ledger, an external execution harness, Git/GitHub evidence, and back to a ledger-recorded evidence pointer, ending in an explicit human milestone accept/decline decision.</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- card background -->
  <rect x="8" y="8" width="864" height="884" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- connectors (drawn first, under boxes) -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M440,88 L440,116" />
    <path d="M440,202 L440,230" />
    <path d="M410,270 L468,270" />
    <path d="M600,308 L600,326 L440,326 L440,336" />
    <path d="M440,414 L440,442" />
    <path d="M440,540 L440,568" />
    <path d="M440,634 L440,662" />
  </g>

  <!-- edge labels -->
  <g font-size="12.5" fill="#475569" font-style="italic">
    <text x="452" y="219">publishes dispatchable subset</text>
    <text x="452" y="431">evidence pointer recorded back</text>
  </g>

  <!-- 1. Spec Kit -->
  <g>
    <rect x="270" y="32" width="340" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="440" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Spec Kit</text>
    <text x="440" y="74" text-anchor="middle" font-size="12" fill="#475569">spec.md → plan.md → tasks.md</text>
  </g>

  <!-- 2. Coordination ledger #1 (Bindle-owned) -->
  <g>
    <rect x="210" y="116" width="460" height="86" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
    <rect x="562" y="124" width="98" height="20" rx="10" fill="#4f46e5" />
    <text x="611" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.4">BINDLE-OWNED</text>
    <text x="440" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Coordination ledger</text>
    <text x="440" y="186" text-anchor="middle" font-size="12.5" fill="#3730a3">status · blocking · claims · evidence pointers</text>
  </g>

  <!-- 3a. Symphony -->
  <g>
    <rect x="150" y="230" width="260" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="280" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Symphony</text>
    <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#475569">optional · external</text>
    <text x="280" y="297" text-anchor="middle" font-size="11.5" fill="#475569">independently run</text>
  </g>

  <!-- 3b. Execution harness -->
  <g>
    <rect x="470" y="230" width="260" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="600" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Execution harness</text>
    <text x="600" y="282" text-anchor="middle" font-size="11.5" fill="#475569">Claude Code or Codex</text>
    <text x="600" y="297" text-anchor="middle" font-size="11.5" fill="#475569">performs the actual work</text>
  </g>

  <!-- 4. Git / GitHub -->
  <g>
    <rect x="290" y="338" width="300" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="440" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Git / GitHub</text>
    <text x="440" y="384" text-anchor="middle" font-size="12" fill="#475569">commits · branches · pull requests</text>
    <text x="440" y="400" text-anchor="middle" font-size="12" fill="#475569">(evidence and history)</text>
  </g>

  <!-- 5. Coordination ledger #2 (Bindle-owned) -->
  <g>
    <rect x="210" y="442" width="460" height="98" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
    <rect x="562" y="450" width="98" height="20" rx="10" fill="#4f46e5" />
    <text x="611" y="464" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.4">BINDLE-OWNED</text>
    <text x="440" y="492" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Coordination ledger</text>
    <text x="440" y="512" text-anchor="middle" font-size="12.5" fill="#3730a3">evidence pointer recorded</text>
    <text x="440" y="528" text-anchor="middle" font-size="11.5" fill="#3730a3">(never a copy of the evidence itself)</text>
  </g>

  <!-- 6. Milestone review-readiness -->
  <g>
    <rect x="250" y="568" width="380" height="66" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="440" y="596" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Milestone review-readiness</text>
    <text x="440" y="616" text-anchor="middle" font-size="12" fill="#475569">mechanical — computed from ledger state</text>
  </g>

  <!-- 7. Human decision -->
  <g>
    <rect x="190" y="662" width="500" height="96" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="3" />
    <text x="440" y="698" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">HUMAN DECISION</text>
    <text x="440" y="721" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">accept / decline</text>
    <text x="440" y="741" text-anchor="middle" font-size="12" font-style="italic" fill="#92400e">never automated from readiness alone</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="150" y="800" width="18" height="18" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="174" y="813">Bindle-owned</text>

    <rect x="330" y="800" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="354" y="813">External / another owner</text>

    <rect x="590" y="800" width="18" height="18" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="614" y="813">Human decision (never automated)</text>
  </g>
</svg>
