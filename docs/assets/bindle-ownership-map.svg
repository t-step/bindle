<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif">
  <title>What Bindle connects and what it owns: Spec Kit's task decomposition and Claude Code/Codex (execution, agents, worktrees) both connect through Bindle's coordination ledger, the one box Bindle durably owns; execution produces Git/GitHub evidence, and an evidence pointer is recorded back into the ledger; knowledge and memory tools (Obsidian, projectmem, transcripts) are referenced as a boundary but never owned or copied.</title>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="8" y="8" width="704" height="454" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)">
    <path d="M240,80 L240,215 L255,215" />
    <path d="M465,215 L585,215 L585,130" />
    <path d="M650,130 L650,350" />
    <path d="M480,398 L420,398 L420,255 L465,255" />
  </g>
  <path d="M255,255 L200,255 L200,398 L240,398" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" />

  <text x="525" y="207" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">optionally via Symphony</text>

  <!-- Spec Kit -->
  <rect x="30" y="40" width="210" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="135" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Spec Kit</text>
  <text x="135" y="95" text-anchor="middle" font-size="11" fill="#475569">task decomposition → tasks.md</text>

  <!-- Execution harness -->
  <rect x="480" y="40" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="585" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Claude Code / Codex</text>
  <text x="585" y="97" text-anchor="middle" font-size="11" fill="#475569">execution · agents · worktrees</text>

  <!-- Bindle core -->
  <rect x="255" y="185" width="210" height="100" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5" />
  <rect x="308" y="196" width="104" height="20" rx="10" fill="#4f46e5" />
  <text x="360" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">BINDLE-OWNED</text>
  <text x="360" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Coordination ledger</text>
  <text x="360" y="266" text-anchor="middle" font-size="11.5" font-style="italic" fill="#3730a3">the one thing Bindle owns</text>

  <!-- Git / GitHub -->
  <rect x="480" y="350" width="210" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="585" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Git / GitHub</text>
  <text x="585" y="411" text-anchor="middle" font-size="11" fill="#475569">commits · branches · pull requests</text>

  <!-- Knowledge & memory tools -->
  <rect x="30" y="350" width="210" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="135" y="382" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Knowledge &amp;</text>
  <text x="135" y="399" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">memory tools</text>
  <text x="135" y="420" text-anchor="middle" font-size="10.5" fill="#475569">Obsidian, projectmem, transcripts</text>

  <!-- legend -->
  <g font-size="11.5" fill="#334155">
    <rect x="40" y="450" width="16" height="16" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="62" y="462">Bindle-owned</text>

    <rect x="220" y="450" width="16" height="16" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="242" y="462">External — another owner</text>

    <line x1="460" y1="458" x2="500" y2="458" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" />
    <text x="508" y="462">Referenced boundary, not owned</text>
  </g>
</svg>
